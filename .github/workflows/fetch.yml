name: Fetch Leaderboards

on:
  schedule:
    - cron: '13 5 * * *'  # 05:13 UTC daily
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      only:
        description: 'Restrict fetch to these endpoint slugs (space-separated, e.g. "llms"). Leave blank for all.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch leaderboards
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python3 scripts/fetch_leaderboards.py ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}

      - name: Render Markdown tables
        run: python3 scripts/render_tables.py

      - name: Render provider-grouped table
        run: python3 scripts/render_by_provider.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/ tables/
          DATE=$(python3 -c "from datetime import datetime, timezone; print(datetime.now(timezone.utc).strftime('%Y-%m-%d'))")
          git diff --cached --quiet || git commit -m "data: ${DATE} daily fetch"
          git push
